name: Test

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch: {}

# Cancel an in-progress run when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - run: go test -race ./...

      # Run fuzzers SEQUENTIALLY, not in parallel. Backgrounding every Fuzz
      # target at once launched ~40 `go test -fuzz` processes, each spawning
      # its own worker pool, which oversubscribed the 2-core runner badly
      # enough that the step was killed (SIGTERM/143) before finishing. Each
      # target gets a hard -timeout so a genuinely stuck single execution
      # (which -fuzztime, a between-execs wall-clock budget, cannot interrupt)
      # fails fast and names the offending fuzzer instead of hanging the step.
      #
      # -parallel=1 runs ONE fuzz worker process (default is GOMAXPROCS = 2 on
      # ubuntu-latest). With 2 workers the worker pool saturates both cores, so
      # at the -fuzztime boundary the coordinator process can be starved long
      # enough to miss its worker-shutdown RPC deadline and fail the step with
      # "context deadline exceeded" — intermittently, with a healthy exec rate
      # and no crasher input. One worker leaves a core for the coordinator, but
      # under heavy first-run discovery (an empty corpus on a fresh runner) the
      # coordinator's minimization/bookkeeping can still race the boundary.
      #
      # PRINCIPLED single retry: a fuzzer that finds a real crasher writes the
      # input to testdata/fuzz/<Fuzz>/ AND fails; the retry replays that seed
      # first and fails AGAIN — deterministically. The shutdown-race flake
      # leaves no crasher, so the retry passes. The retry therefore separates
      # an infra flake (passes on retry) from a real finding (reproduces),
      # rather than masking one. It was verified infra-only: three different
      # fuzzers hit "context deadline exceeded" on CI while each passed every
      # local CI-exact run (no crasher, healthy rate). A persistent failure
      # across BOTH attempts is real and must be investigated, never retried
      # further.
      - name: Fuzz
        run: |
          run_fuzz() {
            go test -run='^$' -fuzz="^$2\$" -fuzztime=10s -timeout=90s -parallel=1 "$1" && return 0
            echo "::warning::fuzz $1 $2 failed once; retrying (Go-fuzzing shutdown race is intermittent on constrained runners — a real crasher reproduces on the retry's seed replay)"
            go test -run='^$' -fuzz="^$2\$" -fuzztime=10s -timeout=90s -parallel=1 "$1"
          }
          for pkg in . ./ocf; do
            for fn in $(go test -list '^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz'); do
              echo "::group::fuzz $pkg $fn"
              run_fuzz "$pkg" "$fn"
              echo "::endgroup::"
            done
          done

  # Differential testing against fastavro (an independent reference impl).
  # The fastavro oracle subprocess cross-checks twmb's encode/decode as Avro
  # bytes; without it TestDifferentialFastavro skips, so the `test` job above
  # stays meaningful on its own. See CORRECTNESS_PLAN.md §Tier 1.
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install fastavro
      - name: fastavro differential
        run: go test -count=1 -run 'TestDifferentialFastavro|TestDifferentialMatrix|TestApacheSchemaTestsVectors' -v .

  # CI-only Java differential (heavy: JVM + avro-tools fat jar). Cross-checks
  # twmb's Parsing Canonical Form + Rabin fingerprint against the reference
  # org.apache.avro.SchemaNormalization, including the multi-reference /
  # forward-reference cases the static vectors omit. The test is behind the
  # `cisuite` build tag so it never runs in a plain `go test ./...`.
  java-differential:
    runs-on: ubuntu-latest
    env:
      AVRO_TOOLS_VERSION: "1.12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch avro-tools
        run: |
          curl -fsSL -o avro-tools.jar \
            "https://repo1.maven.org/maven2/org/apache/avro/avro-tools/${AVRO_TOOLS_VERSION}/avro-tools-${AVRO_TOOLS_VERSION}.jar"
      - name: Build Java oracle
        run: javac -cp avro-tools.jar -d testdata/oracle testdata/oracle/SchemaOracle.java
      - name: Java fingerprint differential
        env:
          AVRO_TOOLS_JAR: ${{ github.workspace }}/avro-tools.jar
        run: go test -tags=cisuite -count=1 -run TestDifferentialJavaFingerprint -v .
      # Value-level differentials against live Java via SchemaOracle's RT
      # round-trip: the matrix sweeps (schema × value) across primitives,
      # logicals, containers, records, and unions, asserting both wires;
      # the invalid-UTF-8 test asserts the documented U+FFFD-on-JSON /
      # verbatim-on-binary policy stays Java-identical.
      - name: Java value differentials (matrix + invalid-UTF-8)
        env:
          AVRO_TOOLS_JAR: ${{ github.workspace }}/avro-tools.jar
        run: go test -tags=cisuite -count=1 -run 'TestDifferentialJavaValueMatrix|TestDifferentialJavaInvalidUTF8' -v .
      # The combinatorial matrix through the Java oracle: every composed
      # (fragment × context) cell and every recursive shape — twmb's wire
      # bytes must survive a Java decode→re-encode byte-identically, and
      # Java's canonical form + Rabin fingerprint must match twmb's for
      # every composed schema. Java is the one external oracle that accepts
      # forward references, so the fwd-ref recursion shapes (which the
      # fastavro differential must skip) are validated here.
      - name: Java matrix differential
        env:
          AVRO_TOOLS_JAR: ${{ github.workspace }}/avro-tools.jar
        run: go test -tags=cisuite -count=1 -run 'TestDifferentialJavaMatrix' .
